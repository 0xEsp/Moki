# Override para un servidor siempre encendido en la red local con memoria de sobra
# (p. ej. un Mac mini con OrbStack o Docker Desktop). Igual que docker-compose.pi.yml pero sin el
# perfil de poca memoria: más runtimes de Chromium, más heap para Node y apagados por inactividad
# más largos.
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
# Requiere el mismo .env que la Pi (lo escribe scripts/deploy/setup-secrets.sh); las variables
# MOKI_PI_HOST / MOKI_PI_PORT conservan ese nombre por compatibilidad y aquí son el host del servidor.
services:
  moki:
    platform: linux/arm64
    image: moki:server
    # Publicado en todas las interfaces del servidor (LAN). El acceso exige MOKI_TOKEN.
    ports: !override
      - "${MOKI_PI_PORT:-7410}:7410"
    environment:
      MOKI_TOKEN: ${MOKI_TOKEN:?Define MOKI_TOKEN en .env (openssl rand -hex 24)}
      MOKI_ALLOWED_HOSTS: ${MOKI_ALLOWED_HOSTS:-${MOKI_PI_HOST}}
      MOKI_PUBLIC_ORIGIN: http://${MOKI_PI_HOST:?Define MOKI_PI_HOST en .env (IP o nombre del servidor)}:${MOKI_PI_PORT:-7410}
      MOKI_EXPORT_HOST_DIR: ${MOKI_EXPORT_HOST_DIR:-${PWD}/data/exports}
      MOKI_CHROMIUM_ARGS: ${MOKI_CHROMIUM_ARGS:-}
      NODE_OPTIONS: --max-old-space-size=${MOKI_NODE_HEAP_MB:-3072}
    mem_limit: ${MOKI_MEM_LIMIT:-6g}
    memswap_limit: ${MOKI_MEMSWAP_LIMIT:-6g}
    shm_size: "2gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7410/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
